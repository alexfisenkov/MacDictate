  - generic [ref=e41]:
    - heading "Download and start dictating" [level=2] [ref=e84]
    - article [ref=e43]:
      - heading "Windows 10 / 11 x64" [level=3] [ref=e44]
      - paragraph [ref=e45]: "Recommended: the EXE installer. It adds MacDictate to Start and opens the first setup window."
      - link "Download EXE installer · Windows 10/11 x64" [ref=e85] [cursor=pointer]:
        - /url: https://github.com/alexfisenkov/MacDictate/releases/download/v1.6.0/MacDictate_Windows_v1.6.0_x64.exe
      - generic [ref=e47]:
        - paragraph [ref=e48]: 1. Download the EXE, run it, and finish installation. Keep “Launch MacDictate” selected to open the main window. Later, open it from Start.
        - paragraph [ref=e49]: "2. Select “Start setup: download model” (~488 MB). Wait for verification and automatic saving. Recognition then works offline."
        - paragraph [ref=e50]: 3. Choose your microphone and select “Test microphone”. Speak for 3 seconds and watch the level. If there is no signal, open “Windows microphone privacy”, allow desktop apps, and retry. Windows usually shows no separate permission prompt.
        - paragraph [ref=e51]: 4. Select “Start recording”, say a phrase, then select “Stop and recognize”. Wait for text in the window and select “Copy text”. This button works independently of Alt.
        - paragraph [ref=e52]: "5. For dictation in another app, test the hotkey and place the cursor in an input field. Tap left Alt twice quickly to start; tap twice again to stop. Right Alt/AltGr does not work. Maximum: 2 minutes. If automatic typing fails, copy the result from MacDictate."
      - paragraph [ref=e53]: Closing the window leaves MacDictate in the tray. Double-click its icon or launch it from Start again to reopen the window.
      - group [ref=e54]:
        - generic "Portable ZIP · no installer" [ref=e86] [cursor=pointer]
        - paragraph [ref=e72]: "ZIP is an alternative for use without installation: extract the whole folder and open MacDictate.exe. Do not run the EXE inside the archive; keep the runtime folder beside it."
        - link "Portable ZIP · no installer" [ref=e87] [cursor=pointer]:
          - /url: https://github.com/alexfisenkov/MacDictate/releases/download/v1.6.0/MacDictate_Windows_v1.6.0_x64.zip
      - paragraph [ref=e56]: "The Windows package has no digital signature: Windows may warn or block it. Verify the official GitHub Release source and, if needed, the SHA-256 in WINDOWS-SHA256SUMS. If available, use “More info” → “Run anyway” only after verification. If computer policy blocks it, contact your administrator. Do not disable Windows protection. Windows Server 2025 checks and synthetic audio do not confirm physical microphone or Alt behavior on Windows 10/11. Windows 10 Home/Pro is outside the official .NET 10 OS support lifecycle. The optional text improvement model is not available on Windows yet."
      - paragraph [ref=e57]: For an error, select “Copy private-safe diagnostics” in the app and send that text to support. You do not need to send audio, dictation, passwords, or screenshots of private conversations.
