  - generic [ref=e41]:
    - heading "Скачайте и начните диктовать" [level=2] [ref=e42]
    - article [ref=e43]:
      - heading "Windows 10 / 11 x64" [level=3] [ref=e44]
      - paragraph [ref=e45]: Рекомендуем установщик EXE. Он добавит MacDictate в меню «Пуск» и откроет окно первой настройки.
      - link "Скачать установщик EXE · Windows 10/11 x64" [ref=e46] [cursor=pointer]:
        - /url: https://github.com/alexfisenkov/MacDictate/releases/download/v1.6.0/MacDictate_Windows_v1.6.0_x64.exe
      - generic [ref=e47]:
        - paragraph [ref=e48]: "1. Скачайте EXE, запустите его и завершите установку. Оставьте включённым «Запустить MacDictate»: откроется основное окно. Позже откройте программу из меню «Пуск»."
        - paragraph [ref=e49]: "2. Нажмите «Начать настройку: скачать модель» (~488 МБ). Дождитесь проверки и автоматического сохранения. Затем распознавание работает без сети."
        - paragraph [ref=e50]: 3. Выберите микрофон и нажмите «Проверить микрофон». Говорите 3 секунды и следите за уровнем. Если сигнала нет, откройте «Доступ к микрофону в Windows», разрешите доступ классическим приложениям и повторите тест. Отдельного запроса Windows обычно нет.
        - paragraph [ref=e51]: 4. Нажмите «Начать запись», произнесите фразу и нажмите «Остановить и распознать». Дождитесь текста в окне и нажмите «Копировать текст». Кнопка работает независимо от Alt.
        - paragraph [ref=e52]: 5. Для диктовки в другое приложение проверьте клавишу, затем поставьте курсор в текстовое поле. Два быстрых нажатия левого Alt начинают запись; ещё два останавливают. Правый Alt/AltGr не подходит. Максимум — 2 минуты; если автопечать не сработала, скопируйте текст в окне MacDictate.
      - paragraph [ref=e53]: Закрытие окна оставляет MacDictate в трее. Двойной щелчок по его значку или повторный запуск из «Пуска» снова покажет окно.
      - group [ref=e54]:
        - generic "Portable ZIP · без установки" [ref=e55] [cursor=pointer]
      - paragraph [ref=e56]: "Windows-пакет без цифровой подписи: Windows может предупредить или заблокировать запуск. Проверьте источник — официальный GitHub Release; при необходимости сверьте SHA-256 из WINDOWS-SHA256SUMS. Если доступно, выберите «Подробнее» → «Выполнить в любом случае» только после проверки. Если политика компьютера запрещает запуск, обратитесь к администратору. Не отключайте защиту Windows. Проверки на Windows Server 2025 и синтетическое аудио не подтверждают работу физического микрофона и Alt на Windows 10/11. Windows 10 Home/Pro вне официального срока поддержки .NET 10. Дополнительной модели улучшения текста в Windows пока нет."
      - paragraph [ref=e57]: При ошибке нажмите в окне «Копировать диагностику без личных данных» и отправьте этот текст в поддержку. Аудио, диктовку, пароли и снимки чужой переписки отправлять не нужно.
