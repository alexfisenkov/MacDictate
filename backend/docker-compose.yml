version: '3.8'
services:
  api:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=${PORT:-3000}
      - DB_PATH=${DB_PATH:-/app/data/database.sqlite}
      - TINKOFF_TERMINAL_KEY=${TINKOFF_TERMINAL_KEY:-}
      - TINKOFF_PASSWORD=${TINKOFF_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://macdictate.pro,http://localhost:3000}
      - OUTBOUND_PROXY_URL=${OUTBOUND_PROXY_URL:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://macdictate.pro}
      - DB_BUSY_TIMEOUT_MS=${DB_BUSY_TIMEOUT_MS:-5000}
      - SLOW_REQUEST_LOG_MS=${SLOW_REQUEST_LOG_MS:-1000}
      - SERVER_REQUEST_TIMEOUT_MS=${SERVER_REQUEST_TIMEOUT_MS:-30000}
      - SERVER_HEADERS_TIMEOUT_MS=${SERVER_HEADERS_TIMEOUT_MS:-35000}
      - SERVER_KEEP_ALIVE_TIMEOUT_MS=${SERVER_KEEP_ALIVE_TIMEOUT_MS:-65000}
    restart: unless-stopped
