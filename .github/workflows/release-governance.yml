name: Release Governance

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "hotfix/**"
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release-governance:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate release governance script syntax
        run: bash -n scripts/verify_release_governance.sh

      - name: Validate release registry JSON
        run: python3 -m json.tool releases/registry.json >/dev/null

      - name: Verify release governance
        run: scripts/verify_release_governance.sh
